<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Resolvedor De Buscaminas</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <div class="header">
    <h1>Resolvedor De Buscaminas</h1>
    <p>En teoría resolverá el Buscaminas</p>
  </div>
  
  <div id="message"></div>
  
  <div class="game-container">
    <div id="board"></div>
    
    <div class="controls-panel">
      <div class="mine-control">
        <label for="mineCount">Minas totales (opcional):</label>
        <input type="number" id="mineCount" min="1" max="99" placeholder="Opcional">
      </div>
      <button id="startBtn">Iniciar Partida</button>
      <button id="nextMoveBtn">Siguiente movimiento</button>
      <button id="restartBtn" class="restart-btn">Reiniciar Juego</button>
    </div>
  </div>
  
  <div class="stats">
    <div class="stat-box">
      <div class="stat-value" id="minasRestantes">-</div>
      <div>Minas restantes</div>
    </div>
    <div class="stat-box">
      <div class="stat-value" id="movimientos">0</div>
      <div>Movimientos</div>
    </div>
  </div>
  
  <script src="script.js"></script>
</body>
</html>
